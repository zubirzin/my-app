# ============================================
# Kubernetes Secret — Sensitive config
# ============================================
# Create secret manually (recommended, avoids plain-text in git):
#   kubectl -n myapp create secret generic myapp-secrets \
#     --from-literal=DATABASE_URL='postgresql://user:pass@host:5432/db' \
#     --from-literal=DATABASE_PASSWORD='your-password'
#
# Or use this file (NOT recommended for production):
# kubectl apply -f k8s/secret.yaml

apiVersion: v1
kind: Secret
metadata:
  name: myapp-secrets
  namespace: myapp
  labels:
    app.kubernetes.io/name: myapp
type: Opaque
stringData:
  DATABASE_URL: "postgresql://myapp:CHANGE_ME@myapp-db:5432/myapp_db"
  DATABASE_USER: "myapp"
  DATABASE_PASSWORD: "CHANGE_ME"
  DATABASE_NAME: "myapp_db"
  DATABASE_SSL: "false"
