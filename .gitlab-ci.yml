# ============================================
# GitLab CI/CD Pipeline — Build, Test, Deploy
# ============================================
# Free tier: 400 pipeline minutes/month
# Docs: https://docs.gitlab.com/ee/ci/

stages:
  - build
  - test
  - deploy

# --------------------------------------------
# Variables
# --------------------------------------------
variables:
  DOCKER_IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  DOCKER_LATEST: $CI_REGISTRY_IMAGE:latest

# --------------------------------------------
# Stage: Build Docker Image
# --------------------------------------------
build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  script:
    - echo "Building Docker image..."
    - docker build -t $DOCKER_IMAGE -t $DOCKER_LATEST .
    - docker push $DOCKER_IMAGE
    - docker push $DOCKER_LATEST
  rules:
    - if: $CI_COMMIT_BRANCH

# --------------------------------------------
# Stage: Test (unit tests, linting, security)
# --------------------------------------------
test:unit:
  stage: test
  image: node:20-alpine
  script:
    - npm ci
    - npm test
  rules:
    - if: $CI_COMMIT_BRANCH

test:lint:
  stage: test
  image: node:20-alpine
  script:
    - npm ci
    - npm run lint || true  # Don't fail on lint warnings
  rules:
    - if: $CI_COMMIT_BRANCH

# --------------------------------------------
# Stage: Security Scanning (GitLab built-in)
# --------------------------------------------
test:security:
  stage: test
  image: docker:latest
  services:
    - docker:dind
  script:
    - echo "Running security scan..."
    # GitLab built-in security templates
    # Add in Settings > CI/CD > Security & Compliance
    - echo "Security scan passed (configure in GitLab UI)"
  rules:
    - if: $CI_COMMIT_BRANCH

# --------------------------------------------
# Stage: Deploy to Server
# --------------------------------------------

# VPS via SSH + Docker Compose
deploy:vps:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - echo "Deploying to VPS..."
    - ssh -o StrictHostKeyChecking=no $VPS_USER@$VPS_HOST "
        cd /opt/myapp &&
        docker compose pull &&
        docker compose up -d &&
        docker system prune -f
      "
  environment:
    name: production
    url: https://your-domain.com
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual

# Google Cloud Run
deploy:cloudrun:
  stage: deploy
  image: google/cloud-sdk:alpine
  script:
    - echo "Deploying to Google Cloud Run..."
    - gcloud auth activate-service-account --key-file=$GCP_SERVICE_ACCOUNT_KEY
    - gcloud config set project $GCP_PROJECT_ID
    - gcloud run deploy myapp
        --image $DOCKER_LATEST
        --platform managed
        --region $GCP_REGION
        --allow-unauthenticated
        --set-env-vars NODE_ENV=production,PORT=3000
  environment:
    name: production
    url: https://myapp-xxxxxx.run.app
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual

# Kubernetes (any cluster)
deploy:k8s:
  stage: deploy
  image: bitnami/kubectl:latest
  script:
    - echo "Deploying to Kubernetes..."
    - kubectl config set-cluster $K8S_CLUSTER --server=$K8S_SERVER
    - kubectl config set-context $K8S_CONTEXT --cluster=$K8S_CLUSTER --user=$K8S_USER
    - kubectl config use-context $K8S_CONTEXT
    - kubectl -n myapp set image deployment/myapp myapp=$DOCKER_LATEST
    - kubectl -n myapp rollout status deployment/myapp
    - kubectl -n myapp get pods -l app.kubernetes.io/name=myapp
  environment:
    name: production
    url: https://your-domain.com
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual  # Require manual approval for production

# --------------------------------------------
# Cleanup (optional)
# --------------------------------------------
cleanup:
  stage: .post
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker system prune -f
  when: always
