name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  DOCKER_IMAGE: ${{ github.repository }}:${{ github.sha }}
  DOCKER_LATEST: ${{ github.repository }}:latest

jobs:
  # ==========================================
  # Build Docker Image
  # ==========================================
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.DOCKER_IMAGE }}
            ghcr.io/${{ env.DOCKER_LATEST }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # Unit Tests
  # ==========================================
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  # ==========================================
  # Lint
  # ==========================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npx eslint server.js tests/

  # ==========================================
  # Security Audit
  # ==========================================
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high || echo "Audit completed with advisories"

  # ==========================================
  # Docker Compose Test (full stack)
  # ==========================================
  test-compose:
    name: Test Docker Compose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start services
        run: docker compose up -d

      - name: Wait for app
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:3000/health > /dev/null 2>&1; then
              echo "App is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "App failed to start"
          docker compose logs
          exit 1

      - name: Test API endpoints
        run: |
          curl -f http://localhost:3000/health
          curl -f http://localhost:3000/api/status
          curl -f http://localhost:3000/api/items

      - name: Database check
        run: |
          docker compose exec -T db psql -U myapp -d myapp_db -c "SELECT * FROM items;"

      - name: Cleanup
        if: always()
        run: docker compose down -v

  # ==========================================
  # Deploy to VPS
  # ==========================================
  deploy-vps:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [build, test]
    if: github.ref == 'refs/heads/main' && vars.VPS_DEPLOY_ENABLED == 'true'
    environment:
      name: production
      url: https://your-domain.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/myapp
            docker compose pull
            docker compose up -d
            docker system prune -f

  # ==========================================
  # Deploy to Kubernetes
  # ==========================================
  deploy-k8s:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: [build, test]
    if: github.ref == 'refs/heads/main' && vars.K8S_DEPLOY_ENABLED == 'true'
    environment:
      name: production
    steps:
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure cluster
        run: |
          echo "${{ secrets.K8S_CERTIFICATE_AUTHORITY_DATA }}" | base64 -d > /tmp/ca.crt
          echo "${{ secrets.K8S_CLIENT_CERTIFICATE_DATA }}" | base64 -d > /tmp/tls.crt
          echo "${{ secrets.K8S_CLIENT_KEY_DATA }}" | base64 -d > /tmp/tls.key
          kubectl config set-cluster ${{ secrets.K8S_CLUSTER }} \
            --server=${{ secrets.K8S_SERVER }} \
            --certificate-authority=/tmp/ca.crt --embed-certs=true
          kubectl config set-credentials deployer \
            --client-certificate=/tmp/tls.crt \
            --client-key=/tmp/tls.key --embed-certs=true
          kubectl config set-context default \
            --cluster=${{ secrets.K8S_CLUSTER }} --user=deployer
          kubectl config use-context default

      - name: Deploy
        run: |
          kubectl apply -f k8s/
          kubectl -n myapp set image deployment/myapp myapp=ghcr.io/${{ github.repository }}:latest
          kubectl -n myapp rollout status deployment/myapp
          kubectl -n myapp get pods -l app.kubernetes.io/name=myapp
