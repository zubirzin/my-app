# ============================================
# docker-compose.yml — Local Development & Testing
# ============================================
# Usage:
#   docker compose up -d        # Start all services
#   docker compose down         # Stop all services
#   docker compose logs -f      # View logs
#   docker compose ps           # List containers
# Docs: https://docs.docker.com/compose/

version: "3.8"

services:
  # --------------------------------------------
  # Web Application
  # --------------------------------------------
  app:
    build: .
    container_name: myapp
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_URL=postgresql://myapp:myapp_password@db:5432/myapp_db
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - DATABASE_USER=myapp
      - DATABASE_PASSWORD=myapp_password
      - DATABASE_NAME=myapp_db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/app/app:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health',r=>process.exit(r.statusCode===200?0:1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - app-network

  # --------------------------------------------
  # PostgreSQL Database
  # --------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: myapp-db
    environment:
      - POSTGRES_USER=myapp
      - POSTGRES_PASSWORD=myapp_password
      - POSTGRES_DB=myapp_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myapp -d myapp_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-network

  # --------------------------------------------
  # Redis (Cache) — Uncomment if needed
  # --------------------------------------------
  # redis:
  #   image: redis:7-alpine
  #   container_name: myapp-redis
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis_data:/data
  #   restart: unless-stopped
  #   networks:
  #     - app-network

  # --------------------------------------------
  # Nginx Reverse Proxy — Uncomment if needed
  # --------------------------------------------
  # nginx:
  #   image: nginx:alpine
  #   container_name: myapp-nginx
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./ssl:/etc/nginx/ssl:ro
  #   depends_on:
  #     - app
  #   restart: unless-stopped
  #   networks:
  #     - app-network

# --------------------------------------------
# Networks
# --------------------------------------------
networks:
  app-network:
    driver: bridge

# --------------------------------------------
# Volumes
# --------------------------------------------
volumes:
  postgres_data:
  redis_data:
